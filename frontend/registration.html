<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register · Quiz Arena</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="registration">
    <header id="hdr"></header>
    <main class="wrap">
      <form class="card" id="f">
        <h2>Create account</h2>
        <label>Name</label><input id="name" required /><label>Email</label
        ><input id="email" type="email" required /><label>Password</label
        ><input id="pw" type="password" minlength="6" required /><label
          >Confirm Password</label
        ><input id="pw2" type="password" required />
        <div style="margin-top: 16px">
          <button class="btn">Register</button>
        </div>
        <div id="m"></div>
        <p class="sub">Have an account? <a href="login.html">Login</a></p>
      </form>
    </main>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
